<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), camera=(), microphone=()" />
  <title>Team — CTE 2018</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --white: #ffffff; --blue: #0a2a6e; --blue-mid: #1a4abf; --blue-light: #2563eb;
      --gold: #c9a227; --gold-light: #f0c94d; --gold-bright: #ffe066;
      --bg: #f5f7fc; --text-dark: #111111; --border: #e2e8f0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text-dark); overflow-x: hidden; }
    ::selection { background: var(--gold); color: var(--blue); }

    #scroll-progress { position: fixed; top: 0; left: 0; width: 0%; height: 3px; z-index: 10001; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold-bright)); border-radius: 0 2px 2px 0; transition: width 0.1s linear; }
    #spotlight { position: fixed; width: 500px; height: 500px; border-radius: 50%; pointer-events: none; z-index: 9998; background: radial-gradient(circle, rgba(201,162,39,0.05) 0%, transparent 60%); transform: translate(-50%, -50%); transition: opacity 0.3s; will-change: left, top; }
    @media (max-width: 768px) { #spotlight { display: none; } }
    #page-transition { position: fixed; inset: 0; z-index: 9999; background: var(--blue); pointer-events: none; clip-path: circle(0% at 50% 50%); transition: clip-path 0.6s cubic-bezier(0.77, 0, 0.18, 1); }
    #page-transition.active { clip-path: circle(150% at 50% 50%); }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(10,42,110,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(201,162,39,0.2); display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 70px; transition: height 0.3s, box-shadow 0.3s; }
    nav.scrolled { height: 56px; box-shadow: 0 4px 40px rgba(0,0,0,0.4); background: rgba(6,24,61,0.98); }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .nav-logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.7rem; color: var(--blue); overflow: hidden; }
    .nav-logo-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .nav-logo-text { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--white); line-height: 1.2; }
    .nav-logo-text span { color: var(--gold-light); }
    .nav-links { display: flex; align-items: center; gap: 0; list-style: none; }
    .nav-links a { font-weight: 600; font-size: 0.9rem; color: rgba(255,255,255,0.75); text-decoration: none; padding: 0.4rem 0.85rem; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; transition: color 0.3s; position: relative; }
    .nav-links a::after { content: ''; position: absolute; bottom: 2px; left: 50%; width: 0; height: 2px; background: var(--gold-light); transition: width 0.3s, left 0.3s; border-radius: 2px; }
    .nav-links a:hover::after, .nav-links a.active::after { width: 60%; left: 20%; }
    .nav-links a:hover, .nav-links a.active { color: var(--gold-light); }
    .nav-join-btn { background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important; color: var(--blue) !important; font-weight: 700 !important; margin-left: 0.5rem; border-radius: 6px !important; }
    .nav-join-btn::after { display: none !important; }
    .nav-join-btn:hover { filter: brightness(1.1) !important; }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; z-index: 1001; }
    .hamburger span { display: block; width: 25px; height: 2px; background: var(--white); border-radius: 2px; transition: 0.3s; }
    .lang-switch { display: flex; gap: 2px; margin-left: 0.75rem; align-items: center; }
    .lang-btn { background: transparent; border: 1px solid rgba(201,162,39,0.25); color: rgba(255,255,255,0.5); font-family: 'Orbitron', sans-serif; font-size: 0.55rem; padding: 0.2rem 0.35rem; border-radius: 4px; cursor: pointer; transition: all 0.25s; letter-spacing: 0.05em; font-weight: 700; line-height: 1.2; }
    .lang-btn:hover { border-color: var(--gold); color: var(--gold-light); }
    .lang-btn.active { background: rgba(201,162,39,0.15); border-color: var(--gold-light); color: var(--gold-light); }
    @media (max-width: 820px) {
      .hamburger { display: flex; }
      .nav-links { position: fixed; top: 0; right: 0; background: rgba(10,42,110,0.98); backdrop-filter: blur(16px); flex-direction: column; gap: 0; width: 260px; height: 100vh; padding: 5rem 0 2rem; border-left: 1px solid rgba(201,162,39,0.2); transform: translateX(110%); transition: transform 0.4s cubic-bezier(0.77, 0, 0.18, 1); }
      .nav-links.open { transform: translateX(0); }
      .nav-links a { display: block; padding: 1rem 2rem; border-radius: 0; border-bottom: 1px solid rgba(201,162,39,0.08); font-size: 1rem; }
      .nav-links a::after { display: none; }
      .nav-join-btn { margin-left: 0; text-align: center; }
      .lang-switch { margin-left: auto; margin-right: 0.5rem; }
    }

    .page-header { margin-top: 70px; background: var(--blue); position: relative; overflow: hidden; padding: 5rem 2rem 3rem; text-align: center; }
    .page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, rgba(37,99,235,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(201,162,39,0.08) 0%, transparent 50%); }
    .page-header-inner { position: relative; z-index: 1; }
    .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; color: var(--white); margin-bottom: 0.5rem; }
    .page-header h1 span { color: var(--gold-light); }
    .page-header p { color: rgba(255,255,255,0.6); font-size: 1.05rem; max-width: 500px; margin: 0 auto; }

    .reveal { opacity: 0; transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal-up { transform: translateY(40px); }
    .reveal-left { transform: translateX(-60px); }
    .reveal-right { transform: translateX(60px); }
    .reveal-scale { transform: scale(0.85); }
    .reveal.visible { opacity: 1; transform: translate(0, 0) scale(1); }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }

    .team-section { max-width: 1100px; margin: 0 auto; padding: 4rem 2rem; }
    .section-header { text-align: center; margin-bottom: 3rem; }
    .section-label { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 0.6rem; }
    .section-title { font-family: 'Orbitron', sans-serif; font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 900; margin-bottom: 0.75rem; background: linear-gradient(90deg, var(--blue), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .section-title.animate-bg { background-size: 200% 200%; animation: gradientShift 4s ease infinite; }
    @keyframes gradientShift { 
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .section-bar { width: 60px; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); margin: 0 auto; border-radius: 2px; }

    /* ── TEAM CARDS ── */
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
    .team-card { background: var(--white); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; transition: box-shadow 0.3s, border-color 0.3s, transform 0.3s; }
    .team-card:hover { box-shadow: 0 20px 50px rgba(10,42,110,0.12); border-color: rgba(201,162,39,0.3); transform: translateY(-4px); }
    .team-card::before { content: ''; display: block; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
    .team-card-body { padding: 2rem 1.5rem; text-align: center; }
    .team-card .avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--blue-light), var(--blue)); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; color: var(--gold-light); border: 3px solid var(--gold); margin: 0 auto 1.2rem; overflow: hidden; }
    .team-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .team-card .name { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; color: var(--blue); margin-bottom: 0.3rem; }
    .team-card .role { font-size: 0.9rem; color: var(--gold); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 0.8rem; }
    .team-card .bio { font-size: 0.85rem; color: #555; line-height: 1.7; }
    .team-card .tag { display: inline-block; margin-top: 1rem; background: rgba(201,162,39,0.1); border: 1px solid rgba(201,162,39,0.2); color: var(--gold); font-family: 'Orbitron', sans-serif; font-size: 0.5rem; letter-spacing: 0.15em; padding: 0.3rem 0.8rem; border-radius: 100px; }

    @media (max-width: 768px) { .team-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }

    footer { background: #06183d; color: rgba(255,255,255,0.4); text-align: center; padding: 2.5rem 2rem; font-size: 0.85rem; position: relative; }
    footer::before { content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,162,39,0.3), transparent); }
    footer span { color: var(--gold); }
    .footer-links { margin-bottom: 0.5rem; display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem; }
    .footer-links a { color: rgba(255,255,255,0.4); text-decoration: none; margin: 0 0.5rem; font-size: 0.85rem; transition: color 0.3s; position: relative; }
    .footer-links a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px; background: var(--gold); transition: width 0.3s; }
    .footer-links a:hover::after { width: 100%; }
    .footer-links a:hover { color: var(--gold-light); }

    #backToTop { position: fixed; bottom: 2rem; left: 2rem; z-index: 999; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; color: var(--blue); font-size: 1.3rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.25); opacity: 0; transform: translateY(20px); transition: opacity 0.3s, transform 0.3s; display: flex; align-items: center; justify-content: center; }
    #backToTop.show { opacity: 1; transform: translateY(0); }
    #backToTop:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.35); }
    html[dir="rtl"] body { direction: rtl; }
    html[dir="rtl"] .nav-links { flex-direction: row-reverse; }
    @media (max-width: 820px) {
      html[dir="rtl"] .nav-links { flex-direction: column; }
    }
  </style>
</head>
<body>

<div id="scroll-progress"></div>
<div id="spotlight"></div>
<div id="page-transition"></div>

<nav id="navbar">
  <a class="nav-logo" href="index.html" data-transition>
    <div class="nav-logo-icon"><img src="cte logo.jpg" alt="CTE"></div>
    <div class="nav-logo-text">CTE <span>2018</span></div>
  </a>
  <div class="hamburger" id="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" data-transition data-i18n="nav-home">Home</a></li>
    <li><a href="inventions.html" data-transition data-i18n="nav-inventions">Inventions</a></li>
    <li><a href="team.html" class="active" data-transition data-i18n="nav-team">Team</a></li>
    <li><a href="contact.html" data-transition data-i18n="nav-contact">Contact</a></li>
    <li><a href="join.html" class="nav-join-btn" data-transition data-i18n="nav-join">Join Us</a></li>
  </ul>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" data-lang="ar" onclick="setLang('ar')">AR</button>
  </div>
</nav>

<section class="page-header">
  <div class="page-header-inner">
    <h1 data-i18n-html="page-title">Meet the <span>Team</span></h1>
    <p data-i18n="page-subtitle">The talented students behind CTE — innovators, engineers, and changemakers</p>
  </div>
</section>

<div class="team-section">
  <div class="section-header">
    <span class="section-label reveal reveal-up" data-i18n="section-label">Our People</span>
    <h2 class="section-title reveal reveal-up" style="transition-delay:0.1s" data-i18n="section-title">Leadership & Founders</h2>
    <div class="section-bar reveal reveal-scale" style="transition-delay:0.2s"></div>
  </div>

  <div class="team-grid" id="team-container">
  </div>
  </div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="index.html" data-transition data-i18n="nav-home">Home</a>
    <a href="inventions.html" data-transition data-i18n="nav-inventions">Inventions</a>
    <a href="team.html" data-transition data-i18n="nav-team">Team</a>
    <a href="contact.html" data-transition data-i18n="nav-contact">Contact</a>
    <a href="join.html" data-transition data-i18n="nav-join">Join Us</a>
  </div>
  <p>© 2024-2026 <span data-i18n="club-name">Technology & Engineering Club</span>. <span data-i18n="rights">All rights reserved.</span></p>
</footer>

<button id="backToTop">↑</button>

<script>
  (function() {
    const bar = document.getElementById('scroll-progress');
    window.addEventListener('scroll', () => { const h = document.documentElement; bar.style.width = ((h.scrollTop || document.body.scrollTop) / (h.scrollHeight - h.clientHeight) * 100) + '%'; });
  })();
  (function() {
    const spot = document.getElementById('spotlight'); let raf;
    document.addEventListener('mousemove', (e) => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { spot.style.left = e.clientX + 'px'; spot.style.top = e.clientY + 'px'; }); });
    document.addEventListener('mouseenter', () => spot.style.opacity = '1');
    document.addEventListener('mouseleave', () => spot.style.opacity = '0');
  })();
  (function() {
    const overlay = document.getElementById('page-transition');
    document.querySelectorAll('[data-transition]').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault(); const href = this.getAttribute('href');
        if (!href || href === '#') return;
        overlay.classList.add('active');
        setTimeout(() => { window.location.href = href; }, 550);
      });
    });
    window.addEventListener('pageshow', () => overlay.classList.remove('active'));
  })();

  function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }
  function closeMenu() { document.getElementById('navLinks').classList.remove('open'); }
  document.addEventListener('click', function(e) {
    const nav = document.getElementById('navLinks');
    const ham = document.getElementById('hamburger');
    if (nav.classList.contains('open') && !nav.contains(e.target) && !ham.contains(e.target)) closeMenu();
  });
  window.addEventListener('scroll', function() {
    const nav = document.getElementById('navbar');
    const btn = document.getElementById('backToTop');
    if (window.scrollY > 50) nav.classList.add('scrolled'); else nav.classList.remove('scrolled');
    if (window.scrollY > 400) btn.classList.add('show'); else btn.classList.remove('show');
  });
  document.getElementById('backToTop').addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));

  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => { 
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        // Add animation class to section titles
        if (e.target.classList.contains('section-title')) {
          e.target.classList.add('animate-bg');
        }
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

  // ── TEAM DATA ──
  const teamData = [
    { id: 'm1', name: 'Ahmed Lahoual', image: 'a.jpg', initials: 'AL',
      role: { en: 'Founder & Lead Inventor', fr: 'Fondateur & Inventeur Principal', ar: 'المؤسس والمخترع الرئيسي' },
      bio: { en: 'Founded CTE in 2018. Student inventor with multiple engineering projects bridging mechanical and electronic systems. Passionate about turning ideas into functional prototypes that solve real-world problems.', fr: 'A fondé CTE en 2018. Étudiant inventeur avec de multiples projets d\'ingénierie reliant les systèmes mécaniques et électroniques. Passionné par la transformation d\'idées en prototypes fonctionnels résolvant des problèmes réels.', ar: 'أسس CTE في 2018. طالب مخترع بمشاريع هندسية متعددة تربط الأنظمة الميكانيكية والإلكترونية. شغوف بتحويل الأفكار إلى نماذج أولية وظيفية تحل مشاكل حقيقية.' },
      tag: { en: 'Founder', fr: 'Fondateur', ar: 'المؤسس' } },
    { id: 'm2', name: 'Kedim Mohamed Amine', image: 'k.jpg', initials: 'KA',
      role: { en: 'Active Member', fr: 'Membre Actif', ar: 'عضو نشط' },
      bio: { en: 'Active member contributing to various projects and initiatives within the club. passionate about technology, innovation, and collaborative problem-solving across engineering disciplines.', fr: 'Membre actif contribuant à divers projets et initiatives au sein du club. Passionné par la technologie, l\'innovation et la résolution collaborative de problèmes dans toutes les disciplines d\'ingénierie.', ar: 'عضو نشط يساهم في مشاريع ومبادرات متنوعة داخل النادي. شغوف بالتكنولوجيا والابتكار وحل المشكلات التعاوني عبر التخصصات الهندسية.' },
      tag: { en: 'Member', fr: 'Membre', ar: 'عضو' } },
    { id: 'm3', name: 'Nadir Benyoucef', image: 'n.jpg', initials: 'NB',
      role: { en: 'President', fr: 'Président', ar: 'الرئيس' },
      bio: { en: 'Civil Engineering student leading the club\'s vision, strategy, and cross-disciplinary collaboration initiatives. Dedicated to expanding CTE\'s impact across the university and local community.', fr: 'Étudiant en Génie Civil dirigeant la vision, la stratégie et les initiatives de collaboration inter-disciplines du club. Dédié à l\'expansion de l\'impact de CTE à travers l\'université et la communauté locale.', ar: 'طالب هندسة مدنية يقود رؤية النادي واستراتيجيته ومبادرات التعاون عبر التخصصات. يسعى لتوسيع تأثير CTE في الجامعة والمجتمع المحلي.' },
      tag: { en: 'President', fr: 'Président', ar: 'الرئيس' } },
    
  ];

  function generateTeam(lang) {
    const container = document.getElementById('team-container');
    if (!container) return;
    container.innerHTML = '';
    const l = lang || 'en';
    teamData.forEach((m, i) => {
      const delay = 'reveal-d' + ((i % 3) + 1);
      const hasImage = m.image && (m.image.startsWith('data:') || /\.(jpg|jpeg|png|gif|webp)$/i.test(m.image));
      const avatarHtml = hasImage
        ? `<img src="${m.image}" alt="${m.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
        : m.initials;
      const card = document.createElement('div');
      card.className = `team-card reveal reveal-up ${delay}`;
      card.innerHTML = `
        <div class="team-card-body">
          <div class="avatar">${avatarHtml}</div>
          <div class="name">${m.name}</div>
          <div class="role">${m.role[l] || m.role.en}</div>
          <p class="bio">${m.bio[l] || m.bio.en}</p>
          <span class="tag">${m.tag[l] || m.tag.en}</span>
        </div>`;
      container.appendChild(card);
    });
    document.querySelectorAll('.team-card.reveal').forEach(el => revealObserver.observe(el));
  }

  // ── LANGUAGE SYSTEM ──
  const translations = {
    en: {
      'nav-home': 'Home', 'nav-inventions': 'Inventions', 'nav-team': 'Team', 'nav-contact': 'Contact', 'nav-join': 'Join Us',
      'club-name': 'Technology & Engineering Club', 'rights': 'All rights reserved.',
      'loading': 'Loading',
      'section-label': 'Our People',
      'section-title': 'Leadership & Founders',
      'page-title': 'Meet the <span>Team</span>',
      'page-subtitle': 'The talented students behind CTE \u2014 innovators, engineers, and changemakers',
      'm1-role': 'Founder & Lead Inventor',
      'm1-bio': 'Founded CTE in 2018. Student inventor with multiple engineering projects bridging mechanical and electronic systems. Passionate about turning ideas into functional prototypes that solve real-world problems.',
      'm1-tag': 'Founder',
      'm2-role': 'Active Member',
      'm2-bio': 'Active member contributing to various projects and initiatives within the club. passionate about technology, innovation, and collaborative problem-solving across engineering disciplines.',
      'm2-tag': 'Member',
      'm3-role': 'President',
      'm3-bio': 'Civil Engineering student leading the club\u2019s vision, strategy, and cross-disciplinary collaboration initiatives. Dedicated to expanding CTE\u2019s impact across the university and local community.',
      'm3-tag': 'President',
      'm4-role': 'Vice President',
      'm4-bio': 'Process Engineering student coordinating workshops, courses, and technical training programs. Focused on creating a supportive learning environment for all engineering disciplines.',
      'm4-tag': 'Vice President',
      'm5-role': 'Electronics Lead',
      'm5-bio': 'Electronics specialist overseeing hardware projects, embedded systems, and prototyping lab activities. Expertise in Arduino, PCB design, and renewable energy systems.',
      'm5-tag': 'Electronics',
      'm6-role': 'Mechanical Lead',
      'm6-bio': 'Mechanical Engineering student leading CAD design, 3D printing, and mechanical prototyping. Passionate about assistive technology and sustainable design innovation.',
      'm6-tag': 'Mechanical'
    },
    fr: {
      'nav-home': 'Accueil', 'nav-inventions': 'Inventions', 'nav-team': '\u00c9quipe', 'nav-contact': 'Contact', 'nav-join': 'Rejoindre',
      'club-name': 'Club de Technologie et d\'Ing\u00e9nierie', 'rights': 'Tous droits r\u00e9serv\u00e9s.',
      'loading': 'Chargement',
      'section-label': 'Notre \u00c9quipe',

  let currentLang = localStorage.getItem('cte-lang') || 'en';

  function applyTranslations(lang) {
    const t = translations[lang] || translations.en;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (t[key]) el.innerHTML = t[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (t[key]) el.placeholder = t[key];
    });
    if (lang === 'ar') { document.documentElement.setAttribute('dir', 'rtl'); } else { document.documentElement.removeAttribute('dir'); }
    localStorage.setItem('cte-lang', lang);
  }

  function setLang(lang) {
    currentLang = lang;
    applyTranslations(lang);
    generateTeam(lang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === lang));
  }

  (async function init() {
    try {
      const res = await fetch('content.json?v=' + Date.now());
      if (res.ok) {
        const json = await res.json();
        if (json.team && json.team.length) { teamData.length = 0; teamData.push(...json.team); }
        if (json.translations && json.translations.team) {
          for (const lang of ['en','fr','ar']) { if (json.translations.team[lang]) { if (!translations[lang]) translations[lang] = {}; Object.assign(translations[lang], json.translations.team[lang]); } }
        }
      }
    } catch(e) {}
    applyTranslations(currentLang);
    generateTeam(currentLang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === currentLang));
  })();
</script>
