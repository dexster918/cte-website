<head>

  <title>Inventions — CTE 2018</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --white: #ffffff; --blue: #0a2a6e; --blue-mid: #1a4abf; --blue-light: #2563eb;
      --gold: #c9a227; --gold-light: #f0c94d; --gold-bright: #ffe066;
      --bg: #f5f7fc; --text-dark: #111111; --border: #e2e8f0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text-dark); overflow-x: hidden; }
    ::selection { background: var(--gold); color: var(--blue); }

    #page-transition {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--blue); pointer-events: none;
      clip-path: circle(0% at 50% 50%);
      transition: clip-path 0.6s cubic-bezier(0.77, 0, 0.18, 1);
    }
    #page-transition.active { clip-path: circle(150% at 50% 50%); }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(10,42,110,0.97); backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 70px;
      transition: height 0.3s, box-shadow 0.3s;
    }
    nav.scrolled { height: 56px; box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .nav-logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.7rem; color: var(--blue); overflow: hidden; }
    .nav-logo-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .nav-logo-text { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--white); line-height: 1.2; }
    .nav-logo-text span { color: var(--gold-light); }
    .nav-links { display: flex; align-items: center; gap: 0; list-style: none; }
    .nav-links a { font-weight: 600; font-size: 0.9rem; color: rgba(255,255,255,0.8); text-decoration: none; padding: 0.4rem 0.85rem; border-radius: 6px; letter-spacing: 0.05em; text-transform: uppercase; transition: color 0.2s; position: relative; }
    .nav-links a::after { content: ''; position: absolute; bottom: 2px; left: 50%; width: 0; height: 2px; background: var(--gold-light); transition: width 0.3s, left 0.3s; border-radius: 2px; }
    .nav-links a:hover::after, .nav-links a.active::after { width: 60%; left: 20%; }
    .nav-links a:hover, .nav-links a.active { color: var(--gold-light); }
    .nav-join-btn { background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important; color: var(--blue) !important; font-weight: 700 !important; margin-left: 0.5rem; border-radius: 6px !important; }
    .nav-join-btn::after { display: none !important; }
    .nav-join-btn:hover { background: var(--gold-bright) !important; }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 25px; height: 2px; background: var(--white); border-radius: 2px; transition: 0.3s; }
    .lang-switch { display: flex; gap: 2px; margin-left: 0.75rem; align-items: center; }
    .lang-btn { background: transparent; border: 1px solid rgba(201,162,39,0.25); color: rgba(255,255,255,0.5); font-family: 'Orbitron', sans-serif; font-size: 0.55rem; padding: 0.2rem 0.35rem; border-radius: 4px; cursor: pointer; transition: all 0.25s; letter-spacing: 0.05em; font-weight: 700; line-height: 1.2; }
    .lang-btn:hover { border-color: var(--gold); color: var(--gold-light); }
    .lang-btn.active { background: rgba(201,162,39,0.15); border-color: var(--gold-light); color: var(--gold-light); }
    @media (max-width: 820px) {
      .hamburger { display: flex; }
      .nav-links { position: fixed; top: 70px; right: 0; background: var(--blue); flex-direction: column; gap: 0; width: 220px; padding: 1rem 0; border-left: 2px solid var(--gold); border-bottom: 2px solid var(--gold); border-radius: 0 0 0 16px; transform: translateX(110%); transition: transform 0.3s; }
      .nav-links.open { transform: translateX(0); }
      .nav-links a { display: block; padding: 0.75rem 1.5rem; border-radius: 0; border-bottom: 1px solid rgba(201,162,39,0.15); }
      .nav-links a::after { display: none; }
      .nav-join-btn { margin-left: 0; }
      .lang-switch { margin-left: auto; margin-right: 0.5rem; }
    }

    .inventions-detail { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }

    .section-header { text-align: center; margin-bottom: 3rem; }
    .section-label { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 0.6rem; }
    .section-title { font-family: 'Orbitron', sans-serif; font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 900; margin-bottom: 0.75rem; background: linear-gradient(90deg, var(--blue), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .section-title.animate-bg { background-size: 200% 200%; animation: gradientShift 4s ease infinite; }
    @keyframes gradientShift { 
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .section-bar { width: 60px; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); margin: 0 auto; border-radius: 2px; }

    .reveal { opacity: 0; transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal-up { transform: translateY(40px); }
    .reveal-left { transform: translateX(-60px); }
    .reveal-right { transform: translateX(60px); }
    .reveal-scale { transform: scale(0.85); }
    .reveal.visible { opacity: 1; transform: translate(0, 0) scale(1); }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }

    .invention-card {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2.5rem; background: var(--white);
      border-radius: 20px; overflow: hidden;
      border: 1px solid var(--border); margin-bottom: 2.5rem;
      transition: box-shadow 0.4s, border-color 0.3s;
    }
    .invention-card:nth-child(even) { direction: rtl; }
    .invention-card:nth-child(even) > * { direction: ltr; }
    .invention-card:hover { box-shadow: 0 25px 60px rgba(10,42,110,0.15); border-color: rgba(201,162,39,0.25); }

    .invention-visual { min-height: 300px; display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; overflow: hidden; }
    .invention-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .invention-visual .bg-shape { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: rgba(201,162,39,0.08); animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 0.2; } }
    .invention-visual .icon { position: relative; z-index: 1; transition: transform 0.3s; }
    .invention-card:hover .invention-visual .icon { transform: scale(1.15) rotate(-5deg); }

    .invention-info { padding: 2rem 2rem 2rem 0; }
    .invention-card:nth-child(even) .invention-info { padding: 2rem 0 2rem 2rem; }
    .invention-info .badge { display: inline-block; background: rgba(201,162,39,0.15); color: var(--gold); font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 0.15em; padding: 0.25rem 0.8rem; border-radius: 100px; margin-bottom: 1rem; }
    .invention-info h2 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--blue); margin-bottom: 0.3rem; }
    .invention-info .inventor { color: var(--gold); font-weight: 600; font-size: 0.95rem; margin-bottom: 1rem; }
    .invention-info .desc { color: #333; line-height: 1.8; font-size: 1rem; margin-bottom: 1.2rem; }
    .invention-info .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .invention-info .tags span { background: var(--bg); border: 1px solid var(--border); padding: 0.3rem 0.8rem; border-radius: 100px; font-size: 0.8rem; font-weight: 600; color: var(--blue-mid); transition: background 0.2s, border-color 0.2s; }
    .invention-info .tags span:hover { background: rgba(201,162,39,0.1); border-color: var(--gold); }

    @media (max-width: 768px) {
      .invention-card { grid-template-columns: 1fr; }
      .invention-card:nth-child(even) { direction: ltr; }
      .invention-card:nth-child(even) .invention-info { padding: 0 1.5rem 1.5rem; }
      .invention-visual { min-height: 200px; }
      .invention-info { padding: 0 1.5rem 1.5rem; }
      .carousel-hero { min-height: 450px; }
      .flat-slide { max-width: 90%; }
    }

    footer { background: #06183d; color: rgba(255,255,255,0.5); text-align: center; padding: 2rem; font-size: 0.9rem; border-top: 2px solid rgba(201,162,39,0.3); }
    footer span { color: var(--gold); }
    .footer-links { margin-bottom: 0.5rem; }
    .footer-links a { color: rgba(255,255,255,0.5); text-decoration: none; margin: 0 0.75rem; font-size: 0.85rem; transition: color 0.2s; position: relative; }
    .footer-links a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px; background: var(--gold); transition: width 0.3s; }
    .footer-links a:hover::after { width: 100%; }
    .footer-links a:hover { color: var(--gold-light); }

    #backToTop { position: fixed; bottom: 2rem; left: 2rem; z-index: 999; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; color: var(--blue); font-size: 1.3rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.25); opacity: 0; transform: translateY(20px); transition: opacity 0.3s, transform 0.3s; display: flex; align-items: center; justify-content: center; }
    #backToTop.show { opacity: 1; transform: translateY(0); }
    #backToTop:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.35); }
    html[dir="rtl"] body { direction: rtl; }
    html[dir="rtl"] .nav-links { flex-direction: row-reverse; }
    @media (max-width: 820px) {
      html[dir="rtl"] .nav-links { flex-direction: column; }
    }

    /* ── INVENTION MODAL ── */
    .inv-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: #0f172a; overflow-y: auto;
      display: flex; align-items: center; justify-content: center; padding: 2rem;
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.77, 0, 0.18, 1);
    }
    .inv-overlay.open { transform: translateX(0); }
    .inv-modal {
      display: grid; grid-template-columns: 1.2fr 1fr;
      grid-template-rows: minmax(0, 1fr);
      width: 100%; max-width: 1100px;
      max-height: calc(100vh - 4rem);
      overflow: hidden; border-radius: 16px; background: var(--white);
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    }
    .inv-modal-img {
      min-height: 300px; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .inv-modal-img img {
      max-width: 100%; max-height: 100%; display: block;
      object-fit: contain; padding: 1.5rem; margin: auto;
    }
    .inv-noimg {
      width: 100%; height: 100%; min-height: 300px;
      display: flex; align-items: center; justify-content: center;
      font-size: 6rem;
    }
    .inv-modal-body { padding: 2rem; position: relative; overflow-y: auto; display: flex; flex-direction: column; gap: 0.85rem; }
    .inv-close {
      position: fixed; top: 1.5rem; right: 1.5rem; z-index: 5;
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
      color: #fff; font-size: 1.4rem; cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.25s, transform 0.25s;
    }
    .inv-close:hover { background: var(--gold); color: var(--blue); transform: rotate(90deg); }
    .inv-body { display: flex; flex-direction: column; gap: 0.75rem; }
    .inv-body > * { opacity: 0; transform: translateY(20px); animation: invFade 0.45s ease forwards; }
    .inv-body > *:nth-child(1) { animation-delay: 0.3s; }
    .inv-body > *:nth-child(2) { animation-delay: 0.38s; }
    .inv-body > *:nth-child(3) { animation-delay: 0.46s; }
    .inv-body > *:nth-child(4) { animation-delay: 0.54s; }
    .inv-body > *:nth-child(5) { animation-delay: 0.62s; }
    .inv-body > *:nth-child(6) { animation-delay: 0.7s; }
    @keyframes invFade { to { opacity: 1; transform: translateY(0); } }
    .inv-badge { display: inline-block; background: rgba(201,162,39,0.15); color: var(--gold); font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 0.15em; padding: 0.3rem 0.9rem; border-radius: 100px; width: fit-content; }
    .inv-mtitle { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--blue); line-height: 1.3; }
    .inv-meta { display: flex; flex-wrap: wrap; gap: 0.75rem 1.2rem; font-size: 0.85rem; color: #555; }
    .inv-meta span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .inv-minventor { color: var(--gold); font-weight: 600; }
    .inv-myear { color: var(--blue-mid); font-weight: 500; }
    .inv-mdomain { color: #666; background: var(--bg); padding: 0.15rem 0.6rem; border-radius: 100px; font-size: 0.8rem; }
    .inv-mdesc { color: #333; line-height: 1.8; font-size: 0.95rem; border-left: 3px solid var(--gold-light); padding-left: 1rem; }
    .inv-section h4 { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue-mid); margin: 0 0 0.5rem; opacity: 0.7; }
    .inv-members { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .inv-member { background: var(--bg); border: 1px solid var(--border); padding: 0.3rem 0.8rem; border-radius: 100px; font-size: 0.8rem; font-weight: 600; color: var(--blue-mid); }
    .inv-mtags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .inv-mtag { background: rgba(201,162,39,0.06); border: 1px solid rgba(201,162,39,0.2); padding: 0.25rem 0.75rem; border-radius: 100px; font-size: 0.75rem; font-weight: 600; color: var(--gold); }
    html[dir="rtl"] .inv-modal { direction: rtl; }
    html[dir="rtl"] .inv-mdesc { border-left: none; border-right: 3px solid var(--gold-light); padding-left: 0; padding-right: 1rem; }
    html[dir="rtl"] .inv-close { right: auto; left: 1.5rem; }
    @media (max-width: 768px) {
      .inv-overlay { padding: 1rem; }
      .inv-modal { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 2rem); }
      .inv-modal-img { min-height: 180px; }
      .inv-modal-img img { max-height: 34vh; }
      .inv-modal-body { padding: 1.5rem; }
      .inv-close { width: 38px; height: 38px; font-size: 1.2rem; }
      .inv-mtitle { font-size: 1.1rem; }
    }
  </style>
</head>

  let currentLang = localStorage.getItem('cte-lang') || 'en';
  function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

  function generateInventions(lang) {
    const container = document.getElementById('inventions-container');
    if (!container) return;
    container.innerHTML = '';
    inventionsData.forEach((inv, i) => {
      const l = lang || 'en';
      const delay = 'reveal-d' + ((i % 4) + 1);
      const visualContent = inv.image
        ? `<img src="${inv.image}" alt="${inv.title[l]}" style="width:100%;height:100%;object-fit:cover;">`
        : `<div class="icon">${inv.icon || '💡'}</div>`;
      const visualStyle = inv.image ? '' : `style="background:${inv.gradient};"`;
      const tags = (inv.tags[l] || inv.tags.en || []).map(t => `<span>${t}</span>`).join('');
      const card = document.createElement('div');
      card.className = `invention-card reveal reveal-up ${delay}`;
      card.innerHTML = `
        <div class="invention-visual" ${visualStyle}>
          <div class="bg-shape"></div>
          <div style="position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;height:100%;">
            ${visualContent}
          </div>
        </div>
        <div class="invention-info">
          <span class="badge">${inv.badge[l] || inv.badge.en}</span>
          <h2>${inv.title[l] || inv.title.en}</h2>
          <p class="inventor">👤 ${inv.inventor[l] || inv.inventor.en}</p>
          <p class="desc">${inv.desc[l] || inv.desc.en}</p>
          <div class="tags">${tags}</div>
        </div>`;
        card.style.cursor = 'pointer';
        card.addEventListener('click', function () {
          this.style.transition = 'transform 0.2s, opacity 0.2s';
          this.style.transform = 'scale(0.96)';
          this.style.opacity = '0.6';
          setTimeout(function () { openInvModal(i); }, 180);
        });
        container.appendChild(card);
      });
      // Re-observe new elements for scroll reveal
    document.querySelectorAll('.invention-card.reveal').forEach(el => revealObserver.observe(el));
  }

  // ── INVENTION MODAL ──
  function openInvModal(idx) {
    const d = inventionsData[idx];
    const l = currentLang;
    const overlay = document.getElementById('invOverlay');
    const title = d.title?.[l] || d.title?.en || '';
    const imgWrap = document.getElementById('invImgWrap');
    imgWrap.innerHTML = d.image
      ? '<img src="' + escapeHtml(d.image) + '" alt="' + escapeHtml(title) + '">'
      : '<div class="inv-noimg" style="background:' + (d.gradient || 'var(--bg)') + ';">' + (d.icon || '💡') + '</div>';
    const body = document.getElementById('invBody');
    body.innerHTML = `
      <span class="inv-badge">INVENTION</span>
      <div class="inv-mtitle" data-i18n="invTitle__${idx}">${escapeHtml(d.title?.[l] || d.title?.en || '')}</div>
      <div class="inv-meta">
        <span class="inv-minventor">${escapeHtml(d.inventor?.[l] || d.inventor?.en || '')}</span>
        <span class="inv-myear">${d.year ? '📅 ' + d.year : ''}</span>
        ${d.domain ? '<span class="inv-mdomain">' + escapeHtml(d.domain?.[l] || d.domain?.en || '') + '</span>' : ''}
      </div>
      <div class="inv-mdesc">${escapeHtml(d.desc?.[l] || d.desc?.en || '')}</div>
      ${d.members && d.members.length ? `
      <div class="inv-section">
        <h4>${l === 'ar' ? 'الفريق' : l === 'fr' ? 'Équipe' : 'Team'}</h4>
        <div class="inv-members">${d.members.map(function (m) { return '<span class="inv-member">' + escapeHtml(m) + '</span>'; }).join('')}</div>
      </div>` : ''}
      ${d.tags && d.tags[l] && d.tags[l].length ? `
      <div class="inv-section">
        <h4>${l === 'ar' ? 'الوسوم' : l === 'fr' ? 'Mots-clés' : 'Tags'}</h4>
        <div class="inv-mtags">${d.tags[l].map(function (t) { return '<span class="inv-mtag">' + escapeHtml(t) + '</span>'; }).join('')}</div>
      </div>` : ''}
    `;
    applyTranslations();
    document.body.style.overflow = 'hidden';
    overlay.classList.add('open');
  }

  function closeInvModal() {
    document.getElementById('invOverlay').classList.remove('open');
    document.body.style.overflow = '';
    document.querySelectorAll('.invention-card').forEach(function (c) {
      c.style.transform = ''; c.style.opacity = '';
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('invClose').addEventListener('click', closeInvModal);
    document.getElementById('invOverlay').addEventListener('click', function (e) { if (e.target === this) closeInvModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeInvModal(); });
  });

      'club-name': 'Club de Technologie et d\'Ingénierie', 'rights': 'Tous droits réservés.',
      'loading': 'Chargement',
      'section-label': 'Innovation Étudiante',
      'section-title': 'Explorez Chaque Projet'
    },
    ar: {
      'nav-home': 'الرئيسية', 'nav-inventions': 'الاختراعات', 'nav-team': 'الفريق', 'nav-contact': 'اتصل بنا', 'nav-join': 'انضم إلينا',
      'club-name': 'نادي التكنولوجيا والهندسة', 'rights': 'جميع الحقوق محفوظة.',
      'loading': 'جاري التحميل',
      'section-label': 'ابتكارات الطلاب',
      'section-title': 'استكشف كل مشروع'
    }
  };

  function applyTranslations(lang) {
    const t = translations[lang] || translations.en;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (t[key]) el.innerHTML = t[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (t[key]) el.placeholder = t[key];
    });
    if (lang === 'ar') { document.documentElement.setAttribute('dir', 'rtl'); } else { document.documentElement.removeAttribute('dir'); }
    localStorage.setItem('cte-lang', lang);
  }

  function setLang(lang) {
    currentLang = lang;
    applyTranslations(lang);
    generateInventions(lang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === lang));
  }

  // ── PAGE TRANSITION ──
  (function() {
    const overlay = document.getElementById('page-transition');
    document.querySelectorAll('[data-transition]').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        if (!href || href === '#') return;
        overlay.classList.add('active');
        setTimeout(() => { window.location.href = href; }, 550);
      });
    });
    window.addEventListener('pageshow', () => { overlay.classList.remove('active'); });
  })();

  // ── NAV ──
  function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }
  function closeMenu() { document.getElementById('navLinks').classList.remove('open'); }
  document.addEventListener('click', function(e) {
    const nav = document.getElementById('navLinks');
    const ham = document.getElementById('hamburger');
    if (nav.classList.contains('open') && !nav.contains(e.target) && !ham.contains(e.target)) closeMenu();
  });
  window.addEventListener('scroll', function() {
    const nav = document.getElementById('navbar');
    const btn = document.getElementById('backToTop');
    if (window.scrollY > 50) nav.classList.add('scrolled'); else nav.classList.remove('scrolled');
    if (window.scrollY > 400) btn.classList.add('show'); else btn.classList.remove('show');
  });
  document.getElementById('backToTop').addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));

  // ── REVEAL OBSERVER ──
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => { 
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        if (e.target.classList.contains('section-title')) {
          e.target.classList.add('animate-bg');
        }
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

  // ── INIT ──
  (async function init() {
    try {
      const res = await fetch('content.json?v=' + Date.now());
      if (res.ok) {
        const json = await res.json();
        if (json.inventions && json.inventions.length) { inventionsData.length = 0; inventionsData.push(...json.inventions); }
        if (json.translations && json.translations.inventions) {
          for (const lang of ['en','fr','ar']) { if (json.translations.inventions[lang]) { if (!translations[lang]) translations[lang] = {}; Object.assign(translations[lang], json.translations.inventions[lang]); } }
        }
      }
    } catch(e) {}
    applyTranslations(currentLang);
    generateInventions(currentLang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === currentLang));
  })();
</script>
<script src="security.js"></script>
</body>
</html>
