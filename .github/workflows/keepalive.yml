# ═══════════════════════════════════════════════════════════════════
#  CTE 2018 — keep-alive
#
#  Render's FREE web service goes to sleep after ~15 minutes without
#  traffic (the next visitor then waits 30-60s for a cold start).
#
#  This workflow pings /health a few times every 10 minutes so the
#  service stays awake, and the site opens instantly for everyone.
#
#  Note: GitHub disables *scheduled* workflows after 60 days without
#  repository activity. If that happens, open the Actions tab and
#  click "Enable workflow" (or push any commit).
# ═══════════════════════════════════════════════════════════════════

name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake the Render service
        run: |
          URL="https://cte-website-1.onrender.com/health"
          for i in 1 2 3 4; do
            printf 'ping %s/4: ' "$i"
            curl -sS -m 90 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' "$URL" || true
            if [ "$i" -lt 4 ]; then sleep 180; fi
          done
          echo "done - service kept awake"
